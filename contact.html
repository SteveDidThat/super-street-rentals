<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Super Street Rentals (prototype)</title><meta name="description" content="Super Street Rentals - exotic & ex-rental auction broker and peer-to-peer car rentals (prototype).">
<link rel="stylesheet" href="assets/style.css"></head><body data-page="contact"><main><div class="wrap"><h1>Contact</h1><p>Email: <span id="em"></span> · Phone: <span id="ph"></span> (placeholders)</p>
<form class="f" id="contactForm"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone"></label>
<label>Topic<select name="topic"><option>Buy a car at auction</option><option>Rent a car</option><option>List my car</option><option>Other</option></select></label>
<label class="full">Message<textarea name="message" rows="5" required></textarea></label><div class="full"><button class="btn">Send</button></div><div class="out full"></div></form></div>
<script>document.addEventListener("DOMContentLoaded",()=>{const c=window.SSR_CONFIG||{};document.getElementById("em").textContent=c.leadEmail;document.getElementById("ph").textContent=c.phone})</script></main><script src="assets/config.js"></script><script src="assets/app.js"></script></body></html>
